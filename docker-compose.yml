version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: libraryuser
      POSTGRES_PASSWORD: librarypassword
    ports:
      - "5432:5432"
    volumes:
      - library_pg_data:/var/lib/postgresql/data

volumes:
  library_pg_data:
